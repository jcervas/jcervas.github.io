<!DOCTYPE html>
<!--
  Feeling-thermometer chart template (Pew style).

  Three ways to use it:
    1. Open /charts/thermometer/ and edit in the panel under the chart, then
       download a PNG or SVG. Nothing is saved; "Download JSON" keeps a copy.
    2. Save a config as a .json file next to this page and open
       /charts/thermometer/?src=my-chart.json  (g20-2026.json is the example).
       Any key left out falls back to DEFAULTS below.
    3. Embed the chart alone, without the editor:
       <iframe src="/charts/thermometer/?src=my-chart.json&embed" ...></iframe>

  Data rows are "label, score" with an optional third column naming a
  bracket group; prefix a label with * to set it in bold. Without group
  names, a new bracket starts wherever the next score is at least
  `groupBreak` points lower than the one above it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeling Thermometer Chart</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #f3f3f1; --panel: #fff; --ink: #1a1a1a; --muted: #666; --line: #d8d8d4; --accent: #3f6f9b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161616; --panel: #212121; --ink: #ececec; --muted: #a0a0a0; --line: #3a3a3a; --accent: #8db4d8; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 704px; margin: 0 auto; padding: 24px 16px 48px; }
/* the chart card stays white in both themes, like the printed graphic */
.card { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
#chart { display: block; width: 100%; height: auto; }
body.embed { background: #fff; }
body.embed main { max-width: none; padding: 0; }
body.embed .card { border: 0; border-radius: 0; }
body.embed .editor { display: none; }

.editor { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.editor h2 { font-size: 1rem; margin: 0 0 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.actions button { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .actions button.primary { color: #111; } }
.actions button:hover { border-color: var(--muted); }
label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
label small { font-weight: 400; }
input, textarea { width: 100%; font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
#f-data { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; }
textarea { resize: vertical; }
details { margin-top: 16px; }
summary { cursor: pointer; font-size: .9rem; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0 12px; }
.status { font-size: .85rem; color: #b3261e; margin: 0 0 12px; }
.status:empty { display: none; }
</style>
</head>
<body>
<main>
  <div class="card"><svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>

  <section class="editor" aria-label="Chart editor">
    <h2>Edit chart</h2>
    <p class="status" id="status"></p>
    <div class="actions">
      <button class="primary" id="dl-png">Download PNG</button>
      <button id="dl-svg">Download SVG</button>
      <button id="dl-json">Download JSON</button>
      <button id="reset">Reset</button>
    </div>

    <label for="f-title">Title</label>
    <input id="f-title" data-key="title">
    <label for="f-subtitle">Subtitle</label>
    <input id="f-subtitle" data-key="subtitle">
    <label for="f-data">Data <small>(one row per item: label, score, optional group; *label for bold; paste from a spreadsheet works)</small></label>
    <textarea id="f-data" rows="12" spellcheck="false"></textarea>
    <label for="f-note">Note</label>
    <textarea id="f-note" data-key="note" rows="2"></textarea>
    <label for="f-source">Source</label>
    <input id="f-source" data-key="source">
    <label for="f-byline">Byline</label>
    <input id="f-byline" data-key="byline">

    <details>
      <summary>Scale and layout</summary>
      <div class="grid">
        <div><label for="f-warm">Top annotation</label><input id="f-warm" data-key="warm"></div>
        <div><label for="f-cold">Bottom annotation</label><input id="f-cold" data-key="cold"></div>
        <div><label for="f-dmin">Scale minimum</label><input id="f-dmin" type="number" data-num="domain.0"></div>
        <div><label for="f-dmax">Scale maximum</label><input id="f-dmax" type="number" data-num="domain.1"></div>
        <div><label for="f-break">Bracket break <small>(points)</small></label><input id="f-break" type="number" min="0" step="0.5" data-num="groupBreak"></div>
        <div><label for="f-height">Scale length <small>(px)</small></label><input id="f-height" type="number" min="150" step="10" data-num="height"></div>
        <div><label for="f-ticks">Tick marks <small>(e.g. 0, 50, 100)</small></label><input id="f-ticks"></div>
        <div><label for="f-dec">Decimals <small>(blank = auto)</small></label><input id="f-dec" type="number" min="0" max="3"></div>
      </div>
    </details>
  </section>
</main>

<script>
const DEFAULTS = {
  title: "How do Americans feel about other G20 countries?",
  subtitle: "Average rating on a feeling thermometer",
  data: [
    { label: "Australia", value: 67 }, { label: "Canada", value: 67 }, { label: "Japan", value: 65 },
    { label: "Italy", value: 64 }, { label: "U.K.", value: 60 }, { label: "France", value: 57 },
    { label: "Germany", value: 57 }, { label: "Mexico", value: 55 }, { label: "South Korea", value: 55 },
    { label: "Brazil", value: 54 }, { label: "Indonesia", value: 48 }, { label: "Argentina", value: 47 },
    { label: "South Africa", value: 47 }, { label: "India", value: 46 }, { label: "Turkey", value: 45 },
    { label: "China", value: 37 }, { label: "Saudi Arabia", value: 36 }, { label: "Russia", value: 27 }
  ],
  note: "Thermometer ratings are on a scale of 0–100, where zero is “as cold and negative as possible” and 100 is “as warm and positive as possible.”",
  source: "Pew Research Center survey of U.S. adults conducted Sept. 14–20, 2026.",
  byline: "Jonathan Cervas | Carnegie Mellon University",
  warm: "Warmer, more positive",
  cold: "Colder, more negative",
  domain: [0, 100],
  groupBreak: 5,     // a new bracket starts when the next score is this many points lower
  height: 480,       // length of the scale, in px at the 640px chart width
  ticks: [],         // scores to mark on the tube, e.g. [0, 50, 100]
  decimals: null,    // null = whole numbers unless a score has a fraction
  colors: {
    warm: "#eaa497", mid: "#e8d4d8", cool: "#c4d4ea",
    mark: "#3f6f9b", ink: "#1a1a1a", muted: "#6b6b6b", rule: "#8c8c8c", note: "#7a7a7a"
  }
};

const NS = "http://www.w3.org/2000/svg";
const W = 640, PAD = 32, LINE = 22, GROUP_GAP = 14, TUBE_W = 22, BULB_R = 21, DOT_R = 7;
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const HEAD = '"Libre Franklin", "Franklin Gothic Medium", "Franklin Gothic", "Helvetica Neue", Arial, sans-serif';
const SERIF = 'Georgia, "Times New Roman", serif';

const svg = document.getElementById("chart");
const params = new URLSearchParams(location.search);
if (params.has("embed")) document.body.classList.add("embed");

let state, original;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

function merge(base, over) {
  const out = { ...base, ...over, colors: { ...base.colors, ...(over.colors || {}) } };
  out.data = parseData(out.data);
  return out;
}

// Rows are "label, score[, group]". The label may itself hold commas: the
// score is the first field after it that is a number.
function parseData(data) {
  if (Array.isArray(data)) return data.map(d => ({ ...d, value: +d.value }));
  return String(data || "").split(/\r?\n/).map(line => {
    const m = line.trim().match(/^(.*?)\s*[,\t]\s*(-?\d+(?:\.\d+)?)\s*(?:[,\t]\s*(.*))?$/);
    if (!m) return null;
    let label = m[1].replace(/^"|"$/g, ""), highlight = false;
    if (label.startsWith("*")) { label = label.slice(1).trim(); highlight = true; }
    const d = { label, value: +m[2] };
    if (m[3]) d.group = m[3].trim();
    if (highlight) d.highlight = true;
    return d;
  }).filter(Boolean);
}

function dataToText(data) {
  return data.map(d => (d.highlight ? "*" : "") + d.label + ", " + d.value + (d.group != null && d.group !== "" ? ", " + d.group : "")).join("\n");
}

// ---- text helpers -------------------------------------------------------
let meter;
function measure(str, style) {
  meter.setAttribute("style", style);
  meter.textContent = str;
  return meter.getComputedTextLength();
}
function wrap(str, width, style) {
  const lines = [];
  let cur = "";
  for (const w of String(str).split(/\s+/).filter(Boolean)) {
    const next = cur ? cur + " " + w : w;
    if (cur && measure(next, style) > width) { lines.push(cur); cur = w; } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}
// Draws wrapped lines with the first baseline at y; returns the last baseline.
function textBlock(lines, x, y, lh, style, anchor) {
  const t = el("text", { x, y, style, "text-anchor": anchor || "start" });
  lines.forEach((ln, i) => {
    const s = el("tspan", { x, dy: i ? lh : 0 }, t);
    s.textContent = ln;
  });
  return y + (lines.length - 1) * lh;
}

// ---- layout -------------------------------------------------------------
function groupItems(items, cfg) {
  const named = items.some(d => d.group != null && d.group !== "");
  const groups = [];
  items.forEach((d, i) => {
    const prev = items[i - 1];
    const g = d.group ?? "", pg = prev ? prev.group ?? "" : "";
    // named groups bracket together; rows without a name fall back to the gap rule
    const split = !prev || (named && String(g) !== String(pg)) || (g === "" && prev.value - d.value >= cfg.groupBreak);
    if (split) groups.push([]);
    groups[groups.length - 1].push(d);
  });
  return groups;
}

// Place each group's label block as near its circles as it can go without
// overlapping its neighbors. Overlapping blocks merge into a cluster that
// sits where it is least far, line for line, from where its labels want to be.
function placeBlocks(blocks, minY, maxY) {
  let clusters = blocks.map(b => ({ blocks: [b] }));
  const span = c => c.blocks.reduce((s, b, i) => s + b.h + (i ? LINE + GROUP_GAP : 0), 0);
  const settle = c => {
    let off = 0, sum = 0, n = 0;
    c.blocks.forEach((b, i) => {
      if (i) off += LINE + GROUP_GAP;
      b.off = off;
      sum += (b.want - off) * b.n; n += b.n;
      off += b.h;
    });
    c.top = Math.min(Math.max(sum / n, minY), maxY - span(c));
  };
  clusters.forEach(settle);
  for (let i = 0; i < clusters.length - 1; ) {
    const a = clusters[i], b = clusters[i + 1];
    if (a.top + span(a) + LINE + GROUP_GAP > b.top + 0.01) {
      a.blocks.push(...b.blocks);
      clusters.splice(i + 1, 1);
      settle(a);
      i = Math.max(0, i - 1);
    } else i++;
  }
  clusters.forEach(c => c.blocks.forEach(b => { b.top = c.top + b.off; }));
}

function fmt(v, dec) { return v.toFixed(dec); }

function render() {
  const cfg = state, C = cfg.colors;
  svg.textContent = "";
  meter = el("text", { x: -9999, y: -9999 });

  const S = {
    title: `font-family:${HEAD};font-weight:700;font-size:23px;fill:${C.ink}`,
    sub: `font-family:${SERIF};font-style:italic;font-size:18px;fill:#555`,
    val: `font-family:${SANS};font-size:15px;fill:${C.ink};font-variant-numeric:tabular-nums`,
    lab: `font-family:${SANS};font-size:15px;fill:${C.ink}`,
    ann: `font-family:${SANS};font-size:11.5px;letter-spacing:.06em;fill:${C.muted}`,
    tick: `font-family:${SANS};font-size:10.5px;fill:${C.muted};font-variant-numeric:tabular-nums`,
    note: `font-family:${SANS};font-size:11.5px;fill:${C.note}`,
    by: `font-family:${SERIF};font-size:15px;fill:${C.ink}`
  };
  const bold = s => s + ";font-weight:700";

  const items = cfg.data.filter(d => d.label && isFinite(d.value))
    .map((d, i) => ({ ...d, i })).sort((a, b) => b.value - a.value || a.i - b.i);
  const dec = cfg.decimals != null && cfg.decimals !== "" ? +cfg.decimals
    : (items.some(d => d.value % 1) ? 1 : 0);
  const ticks = (cfg.ticks || []).map(Number).filter(isFinite);
  const vals = items.map(d => d.value).concat(ticks);
  const d0 = Math.min(+cfg.domain[0], ...vals), d1 = Math.max(+cfg.domain[1], ...vals);

  // header
  let y = PAD + 22;
  y = textBlock(wrap(cfg.title, W - 2 * PAD, S.title), PAD, y, 28, S.title);
  if (cfg.subtitle) y = textBlock(wrap(cfg.subtitle, W - 2 * PAD, S.sub), PAD, y + 32, 23, S.sub);

  // horizontal composition: annotations | tube | brackets | labels, centered
  const annStyle = S.ann;
  const warm = wrap(String(cfg.warm || "").toUpperCase(), 92, annStyle);
  const cold = wrap(String(cfg.cold || "").toUpperCase(), 92, annStyle);
  const annW = Math.max(0, ...warm.concat(cold).map(s => measure(s, annStyle)));
  const valW = Math.max(0, ...items.map(d => measure(fmt(d.value, dec), bold(S.val))));
  const labW = Math.max(0, ...items.map(d => measure(d.label, bold(S.lab))));
  const tickGap = ticks.length ? 30 : 0;
  const BRACKETS = 58;
  const total = annW + 24 + tickGap + TUBE_W + BRACKETS + 10 + valW + 7 + labW;
  const x0 = Math.max(PAD, (W - total) / 2);
  const annCx = x0 + annW / 2;
  const tx = x0 + annW + 24 + tickGap + TUBE_W / 2;
  const cbx = tx + TUBE_W / 2 + 7;          // bracket beside the circles
  const lbx = cbx + BRACKETS - 7;           // bracket beside the labels
  const valX = lbx + 10 + valW;             // right edge of the score column
  const labX = valX + 7;

  // vertical scale
  const groups = groupItems(items, cfg);
  const needed = Math.max(0, items.length - 1) * LINE + Math.max(0, groups.length - 1) * GROUP_GAP;
  const plotTop = y + 34;
  const sTop = plotTop + 14;
  const len = Math.max(+cfg.height || 480, needed - 20, 150);
  const sBot = sTop + len;
  const ys = v => sTop + (d1 - v) / (d1 - d0 || 1) * len;
  const bulbCy = sBot + BULB_R + 2;
  const plotBot = bulbCy + BULB_R;

  // tube
  const defs = el("defs", {});
  const grad = el("linearGradient", { id: "therm-grad", x1: 0, y1: plotTop, x2: 0, y2: plotBot, gradientUnits: "userSpaceOnUse" }, defs);
  el("stop", { offset: 0, "stop-color": C.warm }, grad);
  el("stop", { offset: .5, "stop-color": C.mid }, grad);
  el("stop", { offset: .82, "stop-color": C.cool }, grad);
  el("stop", { offset: 1, "stop-color": C.cool }, grad);
  const r = TUBE_W / 2, a = Math.asin(r / BULB_R), bx = BULB_R * Math.cos(a);
  el("path", {
    d: `M${tx - r},${plotTop + r} A${r},${r} 0 0 1 ${tx + r},${plotTop + r} V${bulbCy - bx} ` +
       `A${BULB_R},${BULB_R} 0 1 1 ${tx - r},${bulbCy - bx} Z`,
    fill: "url(#therm-grad)"
  });

  ticks.forEach(t => {
    const ty = ys(t);
    el("line", { x1: tx - r - 6, x2: tx - r - 1, y1: ty, y2: ty, stroke: C.rule, "stroke-width": 1 });
    el("text", { x: tx - r - 9, y: ty + 3.5, "text-anchor": "end", style: S.tick }).textContent = fmt(t, t % 1 ? dec : 0);
  });

  // annotations, with arrows pointing off the ends of the scale
  const arrow = (x, yA, yB) => {
    el("line", { x1: x, x2: x, y1: yA, y2: yB, stroke: C.muted, "stroke-width": 1.2 });
    const dir = yB < yA ? 1 : -1;
    el("path", { d: `M${x - 4},${yB + dir * 6} L${x},${yB} L${x + 4},${yB + dir * 6}`, fill: "none", stroke: C.muted, "stroke-width": 1.2 });
  };
  if (warm.length) {
    const top = sTop + len * .06;
    arrow(annCx, top + 30, top);
    textBlock(warm, annCx, top + 50, 16, annStyle, "middle");
  }
  if (cold.length) {
    const bot = sBot - len * .04;
    const first = bot - 34 - (cold.length - 1) * 16;
    textBlock(cold, annCx, first - 8, 16, annStyle, "middle");
    arrow(annCx, bot - 28, bot + 2);
  }

  // label blocks
  const blocks = groups.map(g => {
    const cTop = ys(g[0].value), cBot = ys(g[g.length - 1].value), h = (g.length - 1) * LINE;
    return { g, n: g.length, cTop, cBot, cMid: (cTop + cBot) / 2, h, want: (cTop + cBot) / 2 - h / 2 };
  });
  placeBlocks(blocks, plotTop + 6, plotBot - 4);

  // connectors: each runs from the circles' bracket to the labels' bracket,
  // jogging vertically where the two don't line up. Jogs are staggered so
  // two of them never share a vertical run.
  blocks.forEach(b => {
    b.yc = Math.min(Math.max(b.cMid, b.top - (b.n > 1 ? 7 : 0)), b.top + b.h + (b.n > 1 ? 7 : 0));
    b.jog = Math.abs(b.yc - b.cMid) > .5 ? Math.sign(b.yc - b.cMid) : 0;
  });
  const downs = blocks.filter(b => b.jog > 0), ups = blocks.filter(b => b.jog < 0).reverse();
  const right = lbx - 10, left = cbx + 8;
  [downs, ups].forEach(list => {
    const step = Math.min(7, (right - left) / Math.max(1, list.length));
    list.forEach((b, k) => { b.mx = right - k * step; });
  });

  const line = { fill: "none", stroke: C.rule, "stroke-width": 1, "stroke-linecap": "square" };
  blocks.forEach(b => {
    const single = b.cBot - b.cTop < 1;
    const startX = single ? tx + DOT_R + 3 : cbx;
    if (!single) el("path", { d: `M${cbx - 4},${b.cTop} H${cbx} V${b.cBot} H${cbx - 4}`, ...line });
    const endX = b.n > 1 ? lbx : lbx + 4;
    if (b.n > 1) el("path", { d: `M${lbx + 5},${b.top - 7} H${lbx} V${b.top + b.h + 7} H${lbx + 5}`, ...line });
    el("path", { d: b.jog ? `M${startX},${b.cMid} H${b.mx} V${b.yc} H${endX}` : `M${startX},${b.cMid} H${endX}`, ...line });
  });

  // circles, one per distinct score
  const dots = new Map();
  items.forEach(d => {
    const k = fmt(d.value, dec);
    if (!dots.has(k)) dots.set(k, { y: ys(d.value), items: [] });
    dots.get(k).items.push(d);
  });
  const rows = new Map();
  const setOn = (list, on) => list.forEach(d => {
    const row = rows.get(d);
    row.val.setAttribute("style", on || d.highlight ? bold(S.val) : S.val);
    row.lab.setAttribute("style", on || d.highlight ? bold(S.lab) : S.lab);
    row.dot.setAttribute("fill", on ? C.mark : "none");
  });
  dots.forEach((dot, k) => {
    dot.el = el("circle", { cx: tx, cy: dot.y, r: DOT_R, fill: "none", stroke: C.mark, "stroke-width": 1.5 });
    const hit = el("circle", { cx: tx, cy: dot.y, r: DOT_R + 3, fill: "transparent", style: "cursor:default" });
    el("title", {}, hit).textContent = dot.items.map(d => `${d.label}: ${k}`).join("\n");
    hit.addEventListener("mouseenter", () => setOn(dot.items, true));
    hit.addEventListener("mouseleave", () => setOn(dot.items, false));
  });

  // labels
  blocks.forEach(b => b.g.forEach((d, k) => {
    const cy = b.top + k * LINE;
    const v = el("text", { x: valX, y: cy + 5, "text-anchor": "end", style: d.highlight ? bold(S.val) : S.val });
    v.textContent = fmt(d.value, dec);
    const t = el("text", { x: labX, y: cy + 5, style: d.highlight ? bold(S.lab) : S.lab });
    t.textContent = d.label;
    const hit = el("rect", { x: lbx + 6, y: cy - LINE / 2, width: labX + labW - lbx - 4, height: LINE, fill: "transparent" });
    el("title", {}, hit).textContent = `${d.label}: ${fmt(d.value, dec)}`;
    rows.set(d, { val: v, lab: t, dot: dots.get(fmt(d.value, dec)).el });
    hit.addEventListener("mouseenter", () => setOn([d], true));
    hit.addEventListener("mouseleave", () => setOn([d], false));
  }));

  // footer: note across the full width, then source on the left with the
  // byline set against its last line on the right
  y = Math.max(plotBot, ...blocks.map(b => b.top + b.h + 8)) + 36;
  if (cfg.note) y = textBlock(wrap("Note: " + cfg.note, W - 2 * PAD, S.note), PAD, y, 15.5, S.note) + 15.5;
  const byW = cfg.byline ? measure(cfg.byline, S.by) : 0;
  if (cfg.source) y = textBlock(wrap("Source: " + cfg.source, W - 2 * PAD - (byW ? byW + 28 : 0), S.note), PAD, y, 15.5, S.note);
  if (cfg.byline) el("text", { x: W - PAD, y: y + 1, "text-anchor": "end", style: S.by }).textContent = cfg.byline;

  meter.remove();
  const H = Math.ceil(y + PAD - 6);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("aria-label", [cfg.title, cfg.subtitle].filter(Boolean).join(". ") + ". " +
    items.map(d => `${d.label} ${fmt(d.value, dec)}`).join(", "));
}

// ---- export -------------------------------------------------------------
function slug() { return (state.title || "thermometer").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "thermometer"; }

function svgString() {
  const clone = svg.cloneNode(true);
  clone.querySelectorAll("title").forEach(t => t.remove());
  const [, , w, h] = svg.getAttribute("viewBox").split(" ");
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("width", w); bg.setAttribute("height", h); bg.setAttribute("fill", "#fff");
  clone.insertBefore(bg, clone.firstChild);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

document.getElementById("dl-svg").onclick = () => download(new Blob([svgString()], { type: "image/svg+xml" }), slug() + ".svg");
document.getElementById("dl-json").onclick = () =>
  download(new Blob([JSON.stringify(state, null, 2) + "\n"], { type: "application/json" }), slug() + ".json");
document.getElementById("dl-png").onclick = () => {
  const scale = 3, [, , w, h] = svg.getAttribute("viewBox").split(" ").map(Number);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svgString()], { type: "image/svg+xml" }));
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = w * scale; c.height = h * scale;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b => download(b, slug() + ".png"), "image/png");
  };
  img.src = url;
};

// ---- editor -------------------------------------------------------------
const $ = id => document.getElementById(id);
function fillForm() {
  document.querySelectorAll("[data-key]").forEach(i => { i.value = state[i.dataset.key] || ""; });
  document.querySelectorAll("[data-num]").forEach(i => {
    const [k, idx] = i.dataset.num.split(".");
    i.value = idx != null ? state[k][idx] : state[k];
  });
  $("f-data").value = dataToText(state.data);
  $("f-ticks").value = (state.ticks || []).join(", ");
  $("f-dec").value = state.decimals ?? "";
}
document.querySelectorAll("[data-key]").forEach(i => i.addEventListener("input", () => { state[i.dataset.key] = i.value; render(); }));
document.querySelectorAll("[data-num]").forEach(i => i.addEventListener("input", () => {
  if (i.value === "" || !isFinite(i.value)) return;
  const [k, idx] = i.dataset.num.split(".");
  if (idx != null) { state[k] = [...state[k]]; state[k][idx] = +i.value; } else state[k] = +i.value;
  render();
}));
$("f-data").addEventListener("input", e => { state.data = parseData(e.target.value); render(); });
$("f-ticks").addEventListener("input", e => { state.ticks = e.target.value.split(/[\s,]+/).filter(s => s !== "" && isFinite(s)).map(Number); render(); });
$("f-dec").addEventListener("input", e => { state.decimals = e.target.value === "" ? null : +e.target.value; render(); });
$("reset").onclick = () => { state = structuredClone(original); fillForm(); render(); };

(async function boot() {
  let cfg = merge(DEFAULTS, {});
  const src = params.get("src");
  if (src) {
    try {
      const res = await fetch(src);
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      cfg = merge(DEFAULTS, await res.json());
    } catch (err) {
      $("status").textContent = `Could not load ${src} (${err.message}); showing the built-in example.`;
    }
  }
  state = cfg;
  original = structuredClone(cfg);
  fillForm();
  render();
  if (document.fonts) document.fonts.ready.then(render);
})();
</script>
