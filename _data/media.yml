featured:
- title: How a Mapmaker Became New York’s Most Unexpected Power Broker
  outlet: The New York Times
  summary: Jonathan Cervas, a Pittsburgh-born postdoctoral fellow and independent redistricting expert, was appointed as special master to redraw New York’s congressional and state senate maps after the Democratic-drawn maps were struck down as unconstitutional. His maps, praised by Republicans and anti-gerrymandering groups but criticized by Democrats, have upended the political landscape by forcing tough primaries and reshaping minority representation in New York City. Though thrust into the spotlight, Cervas insists he was simply applying the law and serving democracy, not politics.
  url: https://www.nytimes.com/2022/05/28/nyregion/jonathan-cervas-redistricting-maps-ny.html?unlocked_article_code=1.ek8.vcQB.1MWKUMJCGO5R&smid=url-share
  image: /assets/photos/cervas-horiz-1.jpg
- title: Jonathan Cervas’ quest to make government represent the voters
  outlet: Pittsburgh Post-Gazette
  summary: Jonathan Cervas, a postdoctoral fellow at Carnegie Mellon, has quickly risen to prominence as a redistricting specialist, playing key roles in both Pennsylvania’s legislative maps and New York’s high-stakes congressional and state senate redrawing. Trained under noted scholar Bernard Grofman, Cervas emphasizes fairness, neutrality, and voter empowerment, viewing redistricting as both art and science in balancing competing democratic values. Though criticized by some politicians, he sees his work as vital to protecting undiluted votes and strengthening democracy at a moment when gerrymandering and partisan manipulation threaten it.
  url: https://www.post-gazette.com/news/politics-state/2022/09/04/jonathan-cervas-carnegie-mellon-census-redistricting-pa-legislative-districts/stories/202208310151
  image: /assets/photos/photo7.jpeg
- title: What to know about Bernard Grofman and Jonathan Cervas, Wisconsin's new map consultants
  outlet: Milwaukee Journal Sentinel
  summary: Bernard Grofman, a UC-Irvine political scientist, and Jonathan Cervas, a Carnegie Mellon postdoctoral fellow and redistricting expert, were appointed by the Wisconsin Supreme Court to review and possibly redraw the state’s legislative maps. Both are regarded as nonpartisan specialists with extensive experience in redistricting cases across the country, including Virginia, Pennsylvania, and New York. Tasked with ensuring population equality, compliance with the Voting Rights Act, and neutrality regarding partisan advantage, they could recommend adjustments to submitted proposals-or create their own maps—though their role has sparked criticism from some justices who argue the decision hands too much power to unelected outsiders.
  url: https://www.jsonline.com/story/news/politics/2024/01/02/wisconsins-new-maps-could-come-down-to-two-experts-who-are-they/72048291007/
  image: /images/wi.png
- title: Who is the man tasked with redrawing New York’s new district lines?
  outlet: City & State New York
  summary: Jonathan Cervas, a Carnegie Mellon postdoctoral fellow and redistricting expert, was appointed by a New York court as special master to redraw the state’s congressional and senate maps after the previous ones were struck down. Though not widely known, he brings extensive experience from redistricting work in Pennsylvania, Utah, Virginia, and Georgia, where he earned praise for fairness and technical skill. This marks his first time leading the process solo, and his academic background in political science and mapping technology underscores his reputation as a nonpartisan specialist focused on strengthening democracy.
  url: https://www.cityandstateny.com/politics/2022/04/who-man-tasked-redrawing-new-yorks-new-district-lines/366253/
  image: /assets/photos/cervas-classroom-2022.jpg
- title: New York’s Redistricting Master Holds Key to Congressional Power
  outlet: Bloomberg Government
  summary: Jonathan Cervas was appointed by a New York court as special master to redraw the state’s congressional and state Senate district lines after the Democratic-drawn maps were struck down. With a tight deadline and high national stakes-since New York’s maps could influence control of the U.S. House-Cervas is tasked with producing constitutionally sound, ostensibly neutral districts that will last a decade. Drawing on his background working on redistricting cases in several states under renowned expert Bernard Grofman, Cervas is widely described by scholars, advocates, and attorneys as nonpartisan, technically skilled, and attentive to legal constraints and public input. While his past work has not satisfied all political actors, observers largely expect him to act as an “honest broker,” consistent with the broader pattern of court-appointed special masters producing relatively fair maps.
  url: https://about.bgov.com/insights/news/new-yorks-redistricting-master-holds-key-to-congressional-power/
  image: /images/ny.png
