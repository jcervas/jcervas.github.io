title: "Jonathan Cervas"
tagline: "Assistant Teaching Professor, Carnegie Mellon University"
description: >-
  Jonathan Cervas is an Assistant Teaching Professor at Carnegie Mellon
  University who studies redistricting, voting rights, and American political
  institutions. He has served as a court-appointed Special Master, consultant,
  and expert witness in redistricting and voting-rights cases nationwide.
url: "https://jonathancervas.com"   # canonical
author: "Jonathan Cervas"
email: "cervas@cmu.edu"
markdown: kramdown

plugins:
  - jekyll-sitemap        # auto-generates /sitemap.xml at build time
  - jekyll-redirect-from  # serves legacy URLs (see redirect_from: in page front matter)

# Each file in _cases/ becomes its own page at /redistricting/<filename>/
collections:
  cases:
    output: true
    permalink: /redistricting/:name/
  courses:
    output: true
    permalink: /teaching/:name/
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      type: cases
    values:
      layout: case
  - scope:
      type: courses
    values:
      layout: course
  - scope:
      type: publications
    values:
      layout: publication

  # ---- The /maps/ index ----------------------------------------------------
  # One table for every map page, in the order they appear on /maps/:
  #   order       puts the page on the index and sets its position there
  #   wide        aligns its breadcrumb with the map's ~1200px content rather
  #               than the 860px text column
  #   breadcrumb  short label for the trail, in place of the long page title
  #
  # These live here rather than in each page's front matter because several of
  # the map pages are generated output: jcervas/cartograms republishes them into
  # this repo, front matter and all, so anything added to those files by hand is
  # wiped on the next publish. Keeping the keys here puts them out of the
  # generator's reach. Front matter in a page still wins, so a hand-authored
  # page can override any of this locally.
  #
  # Paths are exact files, not directories: a directory scope would also match
  # everything beneath it, which would drag the cartogram-method sub-pages onto
  # the index. A map page with no `order` here is deliberately left off it.
  - scope:
      path: "maps/mid-decade-redistricting/index.html"
    values:
      breadcrumb: "Mid-decade redistricting"
      wide: true
      order: 1
  - scope:
      path: "maps/us-house-2022-cartogram/index.html"
    values:
      breadcrumb: "U.S. House 2022 cartogram"
      wide: true
      order: 2
  - scope:
      path: "maps/apportionment-2020-2030/index.html"
    values:
      breadcrumb: "Apportionment 2020&ndash;2030"
      wide: true
      order: 3
  - scope:
      path: "maps/apportionment-2010-2020/index.html"
    values:
      breadcrumb: "Apportionment 2010&ndash;2020"
      wide: true
      order: 4
  - scope:
      path: "maps/apportionment-2000-2010/index.html"
    values:
      breadcrumb: "Apportionment 2000&ndash;2010"
      wide: true
      order: 5
  - scope:
      path: "maps/cartogram-placement/index.md"
    values:
      breadcrumb: "Placement walkthrough"
      wide: true
      order: 6
  # cartogram-method has no entry on purpose. The walkthrough moved to
  # /maps/cartogram-placement/ and what is left at the old URL is a redirect
  # stub, carrying layout: null and sitemap: false -- giving it an `order`
  # would put a bare redirect on the index.
  - scope:
      path: "maps/cartogram-studio/index.html"
    values:
      breadcrumb: "Cartogram studio"
      wide: true
      order: 8
  - scope:
      path: "maps/alpine-lake-construction/index.html"
    values:
      breadcrumb: "Alpine Lake construction"
      wide: true
      order: 9
  - scope:
      path: "maps/packed-cartogram/index.html"
    values:
      breadcrumb: "Packed cartogram"
      wide: true
      order: 10

# Primary navigation (edit here to change the menu everywhere)
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications/
  - title: Teaching
    url: /teaching/
  - title: Redistricting
    url: /redistricting/
  - title: Media
    url: /media/
  - title: CV
    url: /cv.pdf

# Files Jekyll should ignore when building the site
exclude:
  - README.md
  - _cases/README.md     # docs for authors; must stay excluded or it becomes a case page
  - _courses/README.md        # docs for authors; must stay excluded or it becomes a course page
  - _publications/README.md   # same — keep excluded or it becomes a publication page
  - cv-reference.docx
  - cv_build.sh
  - cmu-media.csv
  - "*.sh"
