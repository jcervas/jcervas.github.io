---
layout: default
---
<article class="wrap page">
  <p class="case-back"><a href="{{ '/publications/' | relative_url }}">&larr; All publications</a></p>

  <h1 class="pub-detail__title">{{ page.title }}</h1>

  <p class="pub-detail__cite">
    {{ page.authors }}.
    <em>{{ page.venue }}</em>,
    <span class="pub-year">{{ page.year }}</span>.
  </p>

  {% if page.link %}
  <p><a class="more-link" href="{{ page.link }}">Read the article &rarr;</a></p>
  {% endif %}

  {% if content != "" %}
  <div class="pub-detail__summary">
    <h2>Summary</h2>
    {{ content }}
  </div>
  {% endif %}
</article>
