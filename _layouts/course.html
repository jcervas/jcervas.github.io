---
layout: default
---
<article class="wrap page">
  <p class="case-back"><a href="{{ '/teaching/' | relative_url }}">&larr; All courses</a></p>

  <h1 class="page-title">{{ page.title }}</h1>
  <div class="course__tags course-detail__tags">
    <span class="course__num">{{ page.number }}</span>
    {% if page.level %}<span class="course__tag">{{ page.level }}</span>{% endif %}
    {% if page.gened %}<span class="course__tag course__tag--gened">Gen Ed &middot; {{ page.gened }}</span>{% endif %}
  </div>
  <p class="course__terms"><strong>Taught:</strong> {{ page.terms }}</p>

  {% if page.syllabus %}
  <p><a class="more-link" href="{{ page.syllabus | relative_url }}">Download the syllabus (PDF) &rarr;</a></p>
  {% endif %}

  <div class="course-body">
    {{ content }}
  </div>
</article>
