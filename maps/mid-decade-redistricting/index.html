<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Mid-Decade Congressional Redistricting &mdash; Expected Seat Shifts</title>
<meta name="description" content="Interactive map of mid-decade congressional redistricting: which states have redrawn their maps, which are blocked or proposed, and the expected partisan seat shifts.">
<meta name="author" content="Jonathan Cervas">

<!-- Set theme before render (shares the main site's saved choice) to avoid a flash -->
<script>
(function () {
  try {
    var s = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme',
      s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
</head>
<body>

<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<main class="page">
  <header class="map-header">
    <h1>Mid-Decade Congressional Redistricting</h1>
    <p class="subtitle">Expected partisan seat shifts from newly enacted congressional maps</p>
    <p class="updated" id="updated" hidden>Updated <span id="updated-date"></span></p>
  </header>

  <figure class="map-figure">
    <div id="map" role="img" aria-label="Map of the United States showing states that have redrawn, proposed, or been blocked from redrawing congressional districts mid-decade, with expected partisan seat gains."></div>
    <div id="tooltip" class="tooltip" hidden></div>
    <figcaption class="map-note">
      <strong>Note:</strong> Utah redrawn after court order. Ohio redrawn as required by statute.
      Louisiana map struck down as a racial gerrymander (<i>LA v.&nbsp;Callais</i>).
      Struck-through values indicate maps that were blocked and are not counted in the totals.
      Data: Dave&rsquo;s Redistricting, VEST.
    </figcaption>
  </figure>

  <footer class="map-footer">
    <p><a href="/">Jonathan Cervas</a> &middot; Carnegie Mellon University</p>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="map.js" defer></script>

<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('theme')) { root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); }
    });
  } catch (e) {}
})();
</script>
</body>
</html>
