<title>The Map Politics Forgot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
/* Tokens alias the host site's where it defines them, and fall back to the
   site's own values when this page is served on its own. */
:root{
  --mm-ink:#1a1a1a; --mm-muted:#5c5c5c; --mm-line:#e4e4e4;
  --mm-surface:#ffffff; --mm-surface2:#f7f7f7; --mm-accent:#C41230; --mm-accent-dark:#9e0f27;
  --mm-faint:#8a8a8a; --mm-line2:#eeeeee;
  --mm-gop:#C41230; --mm-dem:#1f5fa8; --mm-nodata:#d7d7d7;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --mm-ink:#e7e8ea; --mm-muted:#9aa0a6; --mm-line:#33373b;
  --mm-surface:#16181c; --mm-surface2:#202429; --mm-accent:#ff5d6c; --mm-accent-dark:#ff8894;
  --mm-faint:#7c838a; --mm-line2:#26292e;
  --mm-gop:#ff5d6c; --mm-dem:#5a94dd; --mm-nodata:#3a3f45;
}}
:root[data-theme="dark"]{
  --mm-ink:#e7e8ea; --mm-muted:#9aa0a6; --mm-line:#33373b;
  --mm-surface:#16181c; --mm-surface2:#202429; --mm-accent:#ff5d6c; --mm-accent-dark:#ff8894;
  --mm-faint:#7c838a; --mm-line2:#26292e;
  --mm-gop:#ff5d6c; --mm-dem:#5a94dd; --mm-nodata:#3a3f45;
}

.mm-root *,.mm-root{box-sizing:border-box}
.mm-root{color:var(--mm-ink);font-size:18px;line-height:1.6;
  font-family:var(--font,"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif)}
.mm-wrap{max-width:1200px;margin:0 auto;padding-inline:1.25rem;padding-block:2.5rem 1rem}
.mm-root .num,.mm-root table,.mm-root .kv,.mm-root .slist{font-variant-numeric:tabular-nums}

.mm-root h1{font-size:2rem;line-height:1.25;font-weight:700;margin:0 0 .75rem;
  text-wrap:balance;max-width:20ch}
.standfirst{font-size:1.05rem;color:var(--mm-muted);margin:0;max-width:66ch}
.standfirst b{color:var(--mm-ink);font-weight:600}
.mm-head{margin:0 0 .25rem}
section.findings{margin-top:2.75rem}
.mm-root h2{font-size:1.6rem;line-height:1.25;font-weight:700;margin:2.5rem 0 .6rem}
.sectlead{color:var(--mm-muted);max-width:66ch;margin:0 0 1.25rem;font-size:.95rem}

/* ---- controls: the site's chip pattern ---- */
.controls{display:flex;flex-wrap:wrap;gap:.6rem .9rem;align-items:center;
  margin:1.75rem 0 .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip,.tog,.cyc button{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;
  padding:.3rem .8rem;border:1px solid var(--mm-line);border-radius:999px;
  background:var(--mm-surface);color:var(--mm-muted);
  transition:background .15s,color .15s,border-color .15s}
.chip:hover,.tog:hover,.cyc button:hover{border-color:var(--mm-accent);color:var(--mm-accent)}
.chip[aria-pressed="true"],.tog[aria-pressed="true"],.cyc button[aria-pressed="true"]{
  background:var(--mm-accent);border-color:var(--mm-accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root[data-theme="dark"] .tog[aria-pressed="true"],
:root[data-theme="dark"] .cyc button[aria-pressed="true"]{color:#14161a}
.chip:focus-visible,.tog:focus-visible,.cyc button:focus-visible,
#search:focus-visible,.rowbtn:focus-visible{outline:2px solid var(--mm-accent);outline-offset:2px}
.spacer{flex:1 1 auto}
#search{font:inherit;font-size:.85rem;background:var(--mm-surface);color:var(--mm-ink);
  border:1px solid var(--mm-line);border-radius:999px;padding:.3rem .85rem;width:190px}
#search::placeholder{color:var(--mm-faint)}
#search:focus{outline:2px solid var(--mm-accent);border-color:var(--mm-accent)}
.cycwrap{display:flex;align-items:center;gap:.5rem}
.cycwrap[hidden]{display:none}
.cyc{display:flex;gap:.3rem}

/* ---- map ---- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1rem;align-items:start}
.mapcard{position:relative;background:var(--mm-surface);border:1px solid var(--mm-line);
  border-radius:10px;overflow:hidden}
svg#map{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
.dma{vector-effect:non-scaling-stroke;stroke:var(--mm-surface);stroke-width:.6;
  stroke-linejoin:round;cursor:pointer}
.dma:hover{stroke:var(--mm-ink);stroke-width:1.1}
.dma.sel{stroke:var(--mm-ink);stroke-width:1.6}
.stateline{vector-effect:non-scaling-stroke;fill:none;stroke:var(--mm-ink);stroke-width:1.1;
  stroke-opacity:.55;pointer-events:none}
.hidden-lines .stateline{display:none}
.cdline{vector-effect:non-scaling-stroke;fill:none!important;stroke:var(--mm-ink);
  stroke-width:.5;stroke-opacity:.4;stroke-dasharray:2.5 1.8;pointer-events:none}
.cdchg{vector-effect:non-scaling-stroke;fill:none!important;stroke:var(--mm-accent);
  stroke-width:1.05;stroke-opacity:.95;pointer-events:none}
.hidden-cd .cdline,.hidden-cd .cdchg{display:none}
.reset{position:absolute;right:.9rem;top:.9rem;font:inherit;font-size:.78rem;font-weight:600;
  background:var(--mm-surface);color:var(--mm-muted);border:1px solid var(--mm-line);
  border-radius:999px;padding:.25rem .7rem;cursor:pointer}
.reset:hover{color:var(--mm-accent);border-color:var(--mm-accent)}
.legend{display:flex;align-items:baseline;gap:.5rem 1rem;flex-wrap:wrap;
  background:var(--mm-surface2);border-top:1px solid var(--mm-line);padding:.6rem .9rem}
.legend h4,.plabel,.mtag{font-size:.72rem;font-weight:700;color:var(--mm-muted);
  text-transform:uppercase;letter-spacing:.05em;margin:0;flex:none}
.lgrid{display:flex;flex-wrap:wrap;gap:.35rem .9rem;flex:1 1 auto}
.lkey{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--mm-muted)}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.14);flex:none}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--mm-surface);
  border:1px solid var(--mm-line);border-radius:8px;padding:.5rem .65rem;
  font-size:.78rem;color:var(--mm-ink);max-width:250px;line-height:1.45;
  box-shadow:0 4px 14px rgba(0,0,0,.12)}
#tip .t{font-weight:700;font-size:.85rem;display:block;margin-bottom:.15rem}
#tip .m{color:var(--mm-muted)}

/* ---- side panel ---- */
.panel{background:var(--mm-surface);border:1px solid var(--mm-line);border-radius:10px;
  padding:1rem 1.1rem;position:sticky;top:1rem}
.panel .pname{font-weight:700;font-size:1.1rem;line-height:1.25;margin:0 0 .1rem}
.prank{font-size:.75rem;color:var(--mm-accent);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;margin:0 0 .8rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:.25rem .6rem;font-size:.8rem;margin-bottom:.9rem}
.kv dt{color:var(--mm-muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.plabel{padding-top:.7rem;border-top:1px solid var(--mm-line2);margin-bottom:.45rem}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-bottom:.45rem;
  background:var(--mm-surface2)}
.bar i{display:block;height:100%}
.slist{font-size:.78rem;color:var(--mm-muted);display:grid;
  grid-template-columns:auto 1fr auto;gap:.2rem .5rem;align-items:center}
.slist .dot{width:8px;height:8px;border-radius:2px}
.slist b{color:var(--mm-ink);font-weight:600}
.hint{color:var(--mm-muted);font-size:.85rem;margin:.4rem 0 0}

/* ---- findings ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem;
  margin-bottom:2rem}
.tile{background:var(--mm-surface);border:1px solid var(--mm-line);border-radius:10px;
  padding:.9rem 1rem}
.tile .n{font-size:1.9rem;font-weight:700;line-height:1;display:block;margin-bottom:.35rem;
  font-variant-numeric:tabular-nums}
.tile .c{font-size:.85rem;color:var(--mm-muted);line-height:1.45}
.tile.hi,.tile.cd{border-left:3px solid var(--mm-accent)}
.tile.hi .n,.tile.cd .n{color:var(--mm-accent)}

.flat{display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid var(--mm-line);border-radius:10px;overflow:hidden;margin-bottom:1rem}
.flat div{padding:.9rem 1rem;border-right:1px solid var(--mm-line2);background:var(--mm-surface)}
.flat div:last-child{border-right:0}
.flat .y{font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--mm-muted);
  display:block;margin-bottom:.3rem}
.flat .b{font-size:1.7rem;font-weight:700;line-height:1;display:block;
  font-variant-numeric:tabular-nums}
.flat .s{font-size:.82rem;color:var(--mm-muted);display:block;margin-top:.3rem;line-height:1.45}
.flat div.now{background:var(--mm-surface2)}
.flat div.now .b{color:var(--mm-accent)}

.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.2rem;
  align-items:start}
.tblwrap{overflow-x:auto;border:1px solid var(--mm-line);border-radius:10px;
  background:var(--mm-surface)}
.mm-root table{border-collapse:collapse;width:100%;font-size:.82rem}
.mm-root th{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mm-muted);text-align:right;padding:.6rem .75rem;
  border-bottom:1px solid var(--mm-line);white-space:nowrap;position:sticky;top:0;
  background:var(--mm-surface)}
.mm-root th:first-child,.mm-root td:first-child{text-align:left}
.mm-root td{padding:.45rem .75rem;border-bottom:1px solid var(--mm-line2);text-align:right;
  white-space:nowrap}
.mm-root tr:last-child td{border-bottom:0}
.mm-root tbody tr:hover{background:var(--mm-surface2)}
.rowbtn{all:unset;cursor:pointer;color:var(--mm-accent);font-weight:600}
.rowbtn:hover{text-decoration:underline}
.pct,.xr{color:var(--mm-accent);font-weight:700}
.minibar{display:inline-block;height:7px;border-radius:4px;background:var(--mm-accent);
  vertical-align:middle;margin-right:.45rem;min-width:2px}
.cdtag{font-size:.65rem;font-weight:700;letter-spacing:.04em;color:var(--mm-accent);
  border:1px solid var(--mm-accent);border-radius:999px;padding:0 .35rem;margin-left:.35rem}

.note{margin-top:2rem;padding:.9rem 1.1rem;background:var(--mm-surface2);
  border:1px solid var(--mm-line);border-left:3px solid var(--mm-accent);border-radius:8px;
  font-size:.85rem;color:var(--mm-muted);line-height:1.6}
.note h3{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mm-muted);
  margin:0 0 .5rem;font-weight:700}
.note p{margin:0 0 .5rem}
.note p:last-child{margin:0}
.note b{color:var(--mm-ink)}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .panel{position:static}
  #search{width:auto;flex:1 1 150px}
}
@media (max-width:620px){
  .flat{grid-template-columns:1fr}
  .flat div{border-right:0;border-bottom:1px solid var(--mm-line2)}
  .flat div:last-child{border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
